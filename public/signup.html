<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Sign Up — AURA Habit Tracker</title>
  <meta name="description" content="Create your AURA account: Master your habits with a gamified RPG experience."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      background: #0a0a0a;
      color: #fafafa;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    /* Subtle gradient background */
    .login-bg {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: -2;
    }

    .login-bg::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 40%),
                  radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
      animation: slowRotate 60s linear infinite;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Matte White Card */
    .login-card {
      position: relative;
      background: #fafafa;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.5);
      z-index: 10;
      animation: cardAppear 0.5s ease-out;
      max-height: calc(100dvh - 2rem);
      overflow-y: auto;
    }

    /* Hide scrollbar but allow scrolling */
    .login-card::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo Icon */
    .logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      background: #0a0a0a;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Typography */
    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      color: #0a0a0a;
      margin-bottom: 0.375rem;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.9375rem;
      font-weight: 400;
      margin-bottom: 1.75rem;
    }

    /* Form Inputs - Rounded Matte Style */
    .input-group {
      margin-bottom: 0.875rem;
    }

    .input-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }

    .login-input {
      width: 100%;
      padding: 1rem 1.25rem;
      background: #f3f4f6;
      border: 2px solid transparent;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 400;
      color: #0a0a0a;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .login-input:focus {
      border-color: #0a0a0a;
      background: #ffffff;
    }

    .login-input::placeholder {
      color: #9ca3af;
    }

    /* Password Input Wrapper */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper .login-input {
      padding-right: 3.5rem;
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: #0a0a0a;
    }

    /* Password strength indicator */
    .password-strength {
      height: 4px;
      border-radius: 2px;
      margin-top: 0.5rem;
      background: #e5e7eb;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: all 0.3s;
    }

    .password-strength-bar.weak { width: 33%; background: #ef4444; }
    .password-strength-bar.medium { width: 66%; background: #f59e0b; }
    .password-strength-bar.strong { width: 100%; background: #22c55e; }

    .password-hint {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 0.375rem;
    }

    /* Matte Black Signup Button */
    .btn-signup {
      width: 100%;
      padding: 1rem 1.5rem;
      background: #0a0a0a;
      color: #fafafa;
      border: none;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.01em;
      margin-top: 0.5rem;
    }

    .btn-signup:hover {
      background: #1f1f1f;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .btn-signup:active {
      transform: scale(0.98) translateY(0);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .divider span {
      padding: 0 1rem;
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    /* Matte Google Button */
    .btn-google {
      width: 100%;
      padding: 0.9375rem 1.5rem;
      background: #ffffff;
      color: #374151;
      border: 2px solid #e5e7eb;
      border-radius: 1rem;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-google:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    /* Login Link */
    .login-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9375rem;
      color: #6b7280;
    }

    .login-link {
      font-weight: 600;
      color: #0a0a0a;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .login-link:hover {
      opacity: 0.7;
    }

    /* Error message */
    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.875rem 1rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
      font-weight: 500;
    }

    .error-message.show {
      display: block;
      animation: shake 0.4s ease;
    }

    /* Success message */
    .success-message {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
      padding: 0.875rem 1rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
      font-weight: 500;
    }

    .success-message.show {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Loading state */
    .btn-signup.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .btn-signup.loading::after {
      content: '';
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-left: 10px;
      border: 2px solid transparent;
      border-top-color: #fafafa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
        align-items: flex-start;
        padding-top: max(1.5rem, env(safe-area-inset-top));
      }

      .login-card {
        padding: 2rem 1.5rem;
        border-radius: 1.5rem;
        max-height: calc(100dvh - 1.5rem);
      }

      .logo-icon {
        width: 64px;
        height: 64px;
        border-radius: 1rem;
        margin-bottom: 1.25rem;
      }

      .login-title {
        font-size: 1.5rem;
      }

      .login-subtitle {
        font-size: 0.875rem;
        margin-bottom: 1.25rem;
      }

      .input-group {
        margin-bottom: 0.75rem;
      }

      .login-input {
        padding: 0.9375rem 1rem;
        font-size: 1rem;
        border-radius: 0.875rem;
      }

      .btn-signup,
      .btn-google {
        padding: 0.9375rem 1.25rem;
        border-radius: 0.875rem;
      }

      .divider {
        margin: 1.25rem 0;
      }

      .login-text {
        margin-top: 1.25rem;
      }
    }

    /* Extra small devices */
    @media (max-width: 360px) {
      .login-card {
        padding: 1.5rem 1.25rem;
      }

      .login-title {
        font-size: 1.375rem;
      }

      .logo-icon {
        width: 56px;
        height: 56px;
        margin-bottom: 1rem;
      }
    }

    /* Landscape mobile */
    @media (max-height: 700px) {
      body {
        align-items: flex-start;
      }

      .login-card {
        margin: 0 auto;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .logo-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 0.75rem;
      }

      .login-title {
        font-size: 1.25rem;
        margin-bottom: 0.25rem;
      }

      .login-subtitle {
        margin-bottom: 1rem;
        font-size: 0.8125rem;
      }

      .input-group {
        margin-bottom: 0.5rem;
      }

      .login-input {
        padding: 0.75rem 1rem;
      }

      .password-strength {
        margin-top: 0.25rem;
      }

      .password-hint {
        display: none;
      }

      .divider {
        margin: 0.75rem 0;
      }

      .login-text {
        margin-top: 0.75rem;
      }

      .btn-signup {
        margin-top: 0.25rem;
        padding: 0.75rem 1rem;
      }

      .btn-google {
        padding: 0.75rem 1rem;
      }
    }

    /* Focus styles for accessibility */
    .login-input:focus-visible,
    .btn-signup:focus-visible,
    .btn-google:focus-visible,
    .password-toggle:focus-visible,
    .login-link:focus-visible {
      outline: 2px solid #0a0a0a;
      outline-offset: 2px;
    }

    /* Prevent zoom on input focus (iOS) */
    @supports (-webkit-touch-callout: none) {
      .login-input {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="login-bg"></div>

  <!-- Signup Card -->
  <div class="login-card">
    <!-- Logo Icon -->
    <div class="logo-icon">
      <img src="/logo-icon.jpg" alt="AURA" />
    </div>

    <!-- Header -->
    <h1 class="login-title">Create account</h1>
    <p class="login-subtitle">Start your habit journey today</p>

    <!-- Error Message -->
    <div id="error-message" class="error-message"></div>
    
    <!-- Success Message -->
    <div id="success-message" class="success-message"></div>

    <!-- Signup Form -->
    <form id="signup-form">
      <!-- Name -->
      <div class="input-group">
        <label class="input-label" for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="login-input" 
          placeholder="John Doe" 
          required 
          autocomplete="name"
        />
      </div>

      <!-- Username -->
      <div class="input-group">
        <label class="input-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="login-input" 
          placeholder="johndoe" 
          required 
          autocomplete="username"
          pattern="[a-zA-Z0-9_]+"
          title="Only letters, numbers, and underscores"
        />
      </div>

      <!-- Email -->
      <div class="input-group">
        <label class="input-label" for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="login-input" 
          placeholder="john@example.com" 
          required 
          autocomplete="email"
          inputmode="email"
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label class="input-label" for="password">Password</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="login-input" 
            placeholder="Create a password" 
            required 
            autocomplete="new-password"
            minlength="6"
          />
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">
            <span class="material-symbols-outlined" style="font-size: 22px;">visibility</span>
          </button>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar" id="password-strength-bar"></div>
        </div>
        <p class="password-hint" id="password-hint">
          Use 6+ characters with mixed letters and numbers
        </p>
      </div>

      <!-- Signup Button -->
      <button type="submit" class="btn-signup" id="signup-btn">
        Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>or</span>
    </div>

    <!-- Google Signup -->
    <button type="button" class="btn-google" id="google-signup-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign up with Google
    </button>

    <!-- Login Link -->
    <p class="login-text">
      Already have an account? <a href="/login.html" class="login-link">Log In</a>
    </p>
  </div>

  <script>
    // DOM Elements
    const signupForm = document.getElementById('signup-form');
    const nameInput = document.getElementById('name');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const signupBtn = document.getElementById('signup-btn');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const passwordStrengthBar = document.getElementById('password-strength-bar');
    const googleSignupBtn = document.getElementById('google-signup-btn');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      const icon = togglePasswordBtn.querySelector('.material-symbols-outlined');
      icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });

    // Password strength indicator
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let strength = 'weak';
      
      if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) {
        strength = 'strong';
      } else if (password.length >= 6 && (/[A-Z]/.test(password) || /[0-9]/.test(password))) {
        strength = 'medium';
      }
      
      passwordStrengthBar.className = 'password-strength-bar ' + (password.length > 0 ? strength : '');
    });

    // Auto-format username
    usernameInput.addEventListener('input', () => {
      usernameInput.value = usernameInput.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
    });

    // Show error message
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
    }

    // Show success message
    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
    }

    // Hide messages
    function hideMessages() {
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
    }

    // Handle form submission
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const name = nameInput.value.trim();
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validation
      if (!name || !username || !email || !password) {
        showError('Please fill in all fields');
        return;
      }

      if (username.length < 3) {
        showError('Username must be at least 3 characters');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Please enter a valid email address');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }

      // Show loading state
      signupBtn.classList.add('loading');
      signupBtn.textContent = 'Creating account';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, email, password }),
          credentials: 'include'
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        // Store session ID in localStorage
        if (data.sessionId) {
          localStorage.setItem('aura_session_id', data.sessionId);
        }

        // Success
        showSuccess('Account created successfully! Redirecting...');
        
        setTimeout(() => {
          window.location.href = '/';
        }, 1500);
      } catch (err) {
        showError(err.message || 'An error occurred. Please try again.');
        signupBtn.classList.remove('loading');
        signupBtn.textContent = 'Create Account';
      }
    });

    // Google signup handler (placeholder)
    googleSignupBtn.addEventListener('click', () => {
      alert('Google Sign-Up will be implemented with OAuth integration');
    });
  </script>
</body>
</html>
