<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Login — AURA Habit Tracker</title>
  <meta name="description" content="Sign in to AURA: Master your habits with a gamified RPG experience."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      background: #0a0a0a;
      color: #fafafa;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    /* Subtle gradient background */
    .login-bg {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: -2;
    }

    .login-bg::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 40%),
                  radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
      animation: slowRotate 60s linear infinite;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Matte White Login Card */
    .login-card {
      position: relative;
      background: #fafafa;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.5);
      z-index: 10;
      animation: cardAppear 0.5s ease-out;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Logo Icon */
    .logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      background: #0a0a0a;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Typography */
    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      color: #0a0a0a;
      margin-bottom: 0.375rem;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.9375rem;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    /* Form Inputs - Rounded Matte Style */
    .input-group {
      margin-bottom: 1rem;
    }

    .input-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }

    .login-input {
      width: 100%;
      padding: 1rem 1.25rem;
      background: #f3f4f6;
      border: 2px solid transparent;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 400;
      color: #0a0a0a;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .login-input:focus {
      border-color: #0a0a0a;
      background: #ffffff;
    }

    .login-input::placeholder {
      color: #9ca3af;
    }

    /* Password Input Wrapper */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper .login-input {
      padding-right: 3.5rem;
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: #0a0a0a;
    }

    /* Checkbox - Matte style */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #d1d5db;
      background: #ffffff;
      accent-color: #0a0a0a;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox-wrapper input[type="checkbox"]:checked {
      background: #0a0a0a;
      border-color: #0a0a0a;
    }

    .checkbox-wrapper label {
      font-size: 0.875rem;
      color: #4b5563;
      cursor: pointer;
      font-weight: 500;
    }

    /* Forgot Password Link */
    .forgot-link {
      font-size: 0.875rem;
      font-weight: 600;
      color: #0a0a0a;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.7;
    }

    /* Matte Black Login Button */
    .btn-login {
      width: 100%;
      padding: 1rem 1.5rem;
      background: #0a0a0a;
      color: #fafafa;
      border: none;
      border-radius: 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.01em;
    }

    .btn-login:hover {
      background: #1f1f1f;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .btn-login:active {
      transform: scale(0.98) translateY(0);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .divider span {
      padding: 0 1rem;
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    /* Matte Google Button */
    .btn-google {
      width: 100%;
      padding: 0.9375rem 1.5rem;
      background: #ffffff;
      color: #374151;
      border: 2px solid #e5e7eb;
      border-radius: 1rem;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-google:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    /* Sign Up Link */
    .signup-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9375rem;
      color: #6b7280;
    }

    .signup-link {
      font-weight: 600;
      color: #0a0a0a;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .signup-link:hover {
      opacity: 0.7;
    }

    /* Error message */
    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.875rem 1rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
      font-weight: 500;
    }

    .error-message.show {
      display: block;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Loading state */
    .btn-login.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .btn-login.loading::after {
      content: '';
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-left: 10px;
      border: 2px solid transparent;
      border-top-color: #fafafa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
        align-items: flex-start;
        padding-top: max(2rem, env(safe-area-inset-top));
      }

      .login-card {
        padding: 2rem 1.5rem;
        border-radius: 1.5rem;
        margin-top: 1rem;
      }

      .logo-icon {
        width: 64px;
        height: 64px;
        border-radius: 1rem;
      }

      .login-title {
        font-size: 1.5rem;
      }

      .login-subtitle {
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }

      .login-input {
        padding: 0.9375rem 1rem;
        font-size: 1rem;
        border-radius: 0.875rem;
      }

      .btn-login,
      .btn-google {
        padding: 0.9375rem 1.25rem;
        border-radius: 0.875rem;
      }

      .form-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }

    /* Extra small devices */
    @media (max-width: 360px) {
      .login-card {
        padding: 1.5rem 1.25rem;
      }

      .login-title {
        font-size: 1.375rem;
      }
    }

    /* Landscape mobile */
    @media (max-height: 600px) and (orientation: landscape) {
      body {
        align-items: flex-start;
        padding-top: 1rem;
      }

      .login-card {
        margin: 0 auto;
      }

      .logo-icon {
        width: 56px;
        height: 56px;
        margin-bottom: 1rem;
      }

      .login-title {
        font-size: 1.25rem;
        margin-bottom: 0.25rem;
      }

      .login-subtitle {
        margin-bottom: 1rem;
      }

      .input-group {
        margin-bottom: 0.75rem;
      }

      .divider {
        margin: 1rem 0;
      }

      .signup-text {
        margin-top: 1rem;
      }
    }

    /* Focus styles for accessibility */
    .login-input:focus-visible,
    .btn-login:focus-visible,
    .btn-google:focus-visible,
    .password-toggle:focus-visible,
    .forgot-link:focus-visible,
    .signup-link:focus-visible {
      outline: 2px solid #0a0a0a;
      outline-offset: 2px;
    }

    /* Prevent zoom on input focus (iOS) */
    @supports (-webkit-touch-callout: none) {
      .login-input {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="login-bg"></div>

  <!-- Login Card -->
  <div class="login-card">
    <!-- Logo Icon -->
    <div class="logo-icon">
      <img src="/logo-icon.jpg" alt="AURA" />
    </div>

    <!-- Header -->
    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to continue your journey</p>

    <!-- Error Message -->
    <div id="error-message" class="error-message"></div>

    <!-- Login Form -->
    <form id="login-form">
      <!-- Email -->
      <div class="input-group">
        <label class="input-label" for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="login-input" 
          placeholder="you@example.com" 
          required 
          autocomplete="email"
          inputmode="email"
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label class="input-label" for="password">Password</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="login-input" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">
            <span class="material-symbols-outlined" style="font-size: 22px;">visibility</span>
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-row">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="remember" name="remember" checked />
          <label for="remember">Remember me</label>
        </div>
        <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn-login" id="login-btn">
        Sign In
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>or</span>
    </div>

    <!-- Google Login -->
    <button type="button" class="btn-google" id="google-login-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Sign Up Link -->
    <p class="signup-text">
      Don't have an account? <a href="/signup.html" class="signup-link">Sign Up</a>
    </p>
  </div>

  <script>
    // DOM Elements
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const loginBtn = document.getElementById('login-btn');
    const errorMessage = document.getElementById('error-message');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const googleLoginBtn = document.getElementById('google-login-btn');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      const icon = togglePasswordBtn.querySelector('.material-symbols-outlined');
      icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });

    // Show error message
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }

    // Hide error message
    function hideError() {
      errorMessage.classList.remove('show');
    }

    // Handle form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const remember = document.getElementById('remember').checked;

      // Basic validation
      if (!email || !password) {
        showError('Please enter both email and password');
        return;
      }

      // Email format validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Please enter a valid email address');
        return;
      }

      // Show loading state
      loginBtn.classList.add('loading');
      loginBtn.textContent = 'Signing in';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Success - redirect to main app
        if (remember) {
          localStorage.setItem('aura_remember', 'true');
        }
        window.location.href = '/';
      } catch (err) {
        showError(err.message || 'An error occurred. Please try again.');
        loginBtn.classList.remove('loading');
        loginBtn.textContent = 'Sign In';
      }
    });

    // Forgot password handler
    forgotPasswordLink.addEventListener('click', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (email) {
        alert(`Password reset link will be sent to: ${email}`);
      } else {
        alert('Please enter your email address first');
        emailInput.focus();
      }
    });

    // Google login handler (placeholder)
    googleLoginBtn.addEventListener('click', () => {
      alert('Google Sign-In will be implemented with OAuth integration');
    });

    // Check if already logged in
    (async function checkAuth() {
      try {
        const res = await fetch('/api/auth/check');
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated) {
            window.location.href = '/';
          }
        }
      } catch (e) {
        // Not authenticated, stay on login page
      }
    })();
  </script>
</body>
</html>
